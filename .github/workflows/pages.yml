name: Deploy BiblioFlix to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Version static assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["ASSET_VERSION"]
          for html_file in Path("public").glob("*.html"):
              html = html_file.read_text(encoding="utf-8")
              for asset in ("styles.css", "common.js", "pwa.js", "home.js", "catalogue.js", "categories.js", "livre.js"):
                  html = html.replace(f'./{asset}"', f'./{asset}?v={version}"')
              html_file.write_text(html, encoding="utf-8")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')"
            if [ -n "$artifact_id" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages artifact was not available after 60 seconds."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
