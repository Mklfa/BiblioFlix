<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Découvrez les tendances du moment et commandez vos livres sur WhatsApp." />
    <title>Accueil | BiblioFlix</title>
    <link rel="preconnect" href="https://openlibrary.org" />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./common.js" defer></script>
    <script src="./home.js" defer></script>
  </head>
  <body data-page="home">
    <header class="site-header">
      <a class="wordmark" href="./">BiblioFlix</a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a aria-current="page" href="./">Accueil</a>
        <a href="./categories.html">Catégories</a>
        <button class="cart-toggle" type="button" aria-haspopup="dialog" aria-controls="cart-dialog" aria-expanded="false">
          <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 1.9-1.4L22 8H6" />
            <circle cx="9" cy="20" r="1" />
            <circle cx="18" cy="20" r="1" />
          </svg>
          <span class="cart-count" aria-hidden="true">0</span>
        </button>
      </nav>
      <form class="site-search" id="site-search" role="search">
        <label class="sr-only" for="site-search-input">Rechercher un livre</label>
        <input id="site-search-input" name="q" type="search" placeholder="Titre, auteur, sujet" />
        <button type="submit">Rechercher</button>
      </form>
      <a class="header-contact" href="https://wa.me/221755576094?text=Bonjour%2C%20je%20souhaite%20obtenir%20des%20renseignements%20sur%20les%20livres%20disponibles%20sur%20BiblioFlix." target="_blank" rel="noreferrer">WhatsApp</a>
    </header>

    <main>
      <section class="content-section">
        <div class="section-title">
          <div>
            <h1>Tendances actuelles</h1>
          </div>
          <a class="text-link" href="./categories.html#category-line">Voir plus de livres</a>
        </div>
        <p class="section-status" id="popular-status" role="status"></p>
        <div class="book-rail" id="popular-books"></div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="wordmark" href="./">BiblioFlix</a>
      <p>© 2026 BiblioFlix</p>
    </footer>
  </body>
</html>
